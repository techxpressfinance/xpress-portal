name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  check:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4

      # The one supported Python — the same file the Dockerfile follows.
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Dockerfile uses the pinned Python
        run: grep -q "^FROM python:$(cat ../.python-version)-" Dockerfile

      - run: pip install -r requirements-dev.txt
      # Builds the schema through Alembic and fails if the models have drifted
      # from the migrations (tests/test_migrations.py).
      - run: python -m pytest -q

  deploy:
    name: Deploy
    needs: [check, backend]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: sudo /opt/xpress-tech-portal/deploy/deploy.sh
