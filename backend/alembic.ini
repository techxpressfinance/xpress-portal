# Alembic configuration. The database URL is NOT set here — migrations/env.py
# takes it from app.config (DATABASE_URL), the same place the app does.
#
# Normal use goes through the wrapper, which also handles databases that
# predate Alembic:
#     python -m app.migrate
#
# Writing a new migration (from backend/, venv active):
#     alembic revision --autogenerate -m "add foo to bar"
[alembic]
script_location = migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
